<style>
/* Сброс и базовые стили */
body {
    margin: 0;

    display: flex;
    justify-content: center;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;

}

.app-wrapper {

/* Шапка сайта */

}

.auth-buttons {

.btn-sign {

.btn-join {

    padding: 6px 10px;
    font-size: 11px;
    font-weight: bold;

}

/* Навигация (категории) */
.nav-categories {

    padding: 0 15px;
    gap: 18px;
    border-bottom: 1px solid #222;
    overflow-x: auto;
    scrollbar-width: none; 
}
.nav-categories::-webkit-scrollbar { display: none; } 
.nav-item {
    color: #aaa;
    text-decoration: none;
    font-size: 12px;
    font-weight: bold;
    padding: 10px 0;
    text-transform: uppercase;

}
.nav-item.active {

}
.nav-item.premium {
    color: #ffd700; /* Золотой цвет для премиум раздела (можно заменить на #00e5ff) */
}

/* Главный баннер (подгрузка из Cloudflare) */
.hero-container {
    position: relative;
    width: 100%;
    aspect-ratio: 4/3; 
    background: #111;
    margin-top: 15px;
    overflow: hidden;
}
.xh-frame {
    position: absolute;
    width: 100%;
    height: 100%;
    object-fit: cover;
    opacity: 0;
    transition: opacity 0.5s ease;
}
.xh-frame.loaded {
    opacity: 1;
}
.xh-loader {
    position: absolute;
    top: 50%;
    left: 50%;
    width: 40px;
    height: 40px;
    border: 3px solid rgba(0, 229, 255, 0.2);
    border-top-color: #00e5ff;
    border-radius: 50%;
    transform: translate(-50%,-50%);
    animation: spin 1s linear infinite;
    z-index: 10;
}
@keyframes spin { to { transform: translate(-50%,-50%) rotate(360deg); } }

/* Сетка контента ниже */
.content-grid {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 12px;
    padding: 15px;
}
.grid-item {
    position: relative;
    width: 100%;
    aspect-ratio: 3/4; /* Вертикальные постеры */
    background: #222;
    border-radius: 4px;
    overflow: hidden;
}
/* Модификатор для широкой картинки на всю строку */
.grid-item.full-width {
    grid-column: 1 / -1; /* Растянуть на все колонки */
    aspect-ratio: 16/9; /* Пропорции 640x360 */
}
.grid-item img {
    width: 100%;
    height: 100%;
    object-fit: cover;
}

/* Градиент для текста на миниатюрах */
.grid-overlay {
    position: absolute;
    bottom: 0;
    left: 0;
    width: 100%;
    background: linear-gradient(transparent, rgba(0,0,0,0.9));
    padding: 20px 10px 10px;
    box-sizing: border-box;
    text-align: center;
}
.grid-title {
    font-size: 11px;
    font-weight: bold;
    color: #fff;
    display: -webkit-box;
    -webkit-line-clamp: 2;
    -webkit-box-orient: vertical;
    overflow: hidden;
}

/* Фиксированная кнопка внизу */
.bottom-cta-wrapper {
    position: fixed;
    bottom: 0;
    width: 100%;
    max-width: 480px;
    background: rgba(13, 13, 17, 0.95);
    padding: 15px;
    box-sizing: border-box;
    border-top: 1px solid #222;
    z-index: 50;
    backdrop-filter: blur(5px);
}
.btn-cta {
    background: #00e5ff;

    font-size: 16px;

    letter-spacing: 1px;

}
@keyframes pulseCTA {
    0% { transform: scale(1); }
    50% { transform: scale(1.02); box-shadow: 0 4px 20px rgba(0, 229, 255, 0.5); }
    100% { transform: scale(1); }
}
</style>

<<script>
// Логика подгрузки изображения из Cloudflare
(function(){
    const p = new URLSearchParams(location.search);
    
    // ИЗМЕНЕНИЕ ЗДЕСЬ: поменяли "var_2" на "campaignid"
    const cid = p.get("campaignid"); 
    const cr  = p.get("creative_id");
    
    const frame  = document.getElementById("frame");
    const loader = document.getElementById("loader");
    const CDN = "https://17534.igennos.store/frames";

    if(cid && cr){
        const img = new Image();
        img.onload = () => {
            frame.src = img.src;
            requestAnimationFrame(() => frame.classList.add("loaded"));
            loader.style.display = "none";
        };
        img.onerror = () => {
            console.error("Image load failed.");
            loader.style.display = "none";
        };
        img.src = `${CDN}/${cid}/${cr}.webp`;
    } else {
        setTimeout(() => loader.style.display = "none", 3000);
    }
})();
</script>

<script>
// Локализация текстов и рандомизация картинок
document.addEventListener("DOMContentLoaded", function() {
    
    // --- 1. Рандомизация миниатюр ---
    const thumb1 = document.getElementById('thumb-1');
    const thumb2 = document.getElementById('thumb-2');

    // Math.random() генерирует число от 0 до 1. Если оно больше 0.5 (шанс 50%), меняем путь к картинке

    // --- 2. Словари локализации ---
    const dict = {
        en: {

                "Step-sister gets stuck and asks for...", "Hardcore scene for a young college student...",

                "Домашнее видео: муж застукал жену...", "Лучшее видео этой недели..."
            ]
        },
        es: { 
            cta: "Gratis 3 días - ¡Únete ahora!",
            random: [
                "Contenido exclusivo en 4K...", "Tendencia en tu región ahora mismo...", 
                "Hermanastra se atasca y pide...", "Escena hardcore para universitaria...", 
                "Casero: marido pilla a su mujer...", "El vídeo más valorado de la semana..."
            ]
        }
    };

    // Определение языка
    let userLang = (navigator.language || navigator.userLanguage).slice(0, 2).toLowerCase();
    if (!dict[userLang]) userLang = 'en';
    
    const t = dict[userLang];

    // Подмена текста на кнопке
    const ctaBtn = document.getElementById('t-cta');
    if(ctaBtn) ctaBtn.innerText = t.cta;

    // --- 3. Распределение случайного текста на все 3 блока ---
    const titleElements = document.querySelectorAll('.dynamic-text');

        const randomIndex = Math.floor(Math.random() * t.random.length);
        el.innerText = t.random[randomIndex];
    });
});
